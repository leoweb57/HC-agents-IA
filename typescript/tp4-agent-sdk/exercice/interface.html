<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent d'atelier</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0B1524; color: #EAF0F8; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 120px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .bulle { padding: 12px 16px; border-radius: 12px; line-height: 1.45; white-space: pre-wrap; }
  .vous { align-self: flex-end; background: #1D57C8; max-width: 80%; }
  .agent { align-self: flex-start; background: #111F33; border: 1px solid #26374F; max-width: 90%; }
  .outil { align-self: flex-start; font: 13px ui-monospace, monospace; color: #A9B8CC; }
  .accord { align-self: flex-start; background: #111F33; border: 1px solid #F3B24A; }
  .accord button { margin: 10px 8px 0 0; padding: 8px 16px; border-radius: 8px; border: 0; font-size: 15px; cursor: pointer; }
  .oui { background: #F3B24A; color: #0B1524; } .non { background: #26374F; color: #EAF0F8; }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: #0B1524; border-top: 1px solid #26374F; padding: 16px; }
  form div { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #26374F; background: #111F33; color: #EAF0F8; font-size: 16px; }
  form button { padding: 12px 20px; border-radius: 8px; border: 0; background: #5AA2FF; color: #0B1524; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<main id="fil">
  <h1>Agent d'atelier</h1>
  <div class="bulle agent">Bonjour, je suis l'assistant de l'atelier. Que voulez-vous savoir ?</div>
</main>
<form id="formulaire"><div>
  <input type="text" id="saisie" placeholder="Votre message" autocomplete="off" autofocus>
  <button>Envoyer</button>
</div></form>
<script>
  const fil = document.getElementById("fil");
  const saisie = document.getElementById("saisie");
  let sessionId = null; // l'identifiant de session du SDK, gardé par la page

  function ajouter(classe, texte) {
    const element = document.createElement("div");
    element.className = classe;
    element.textContent = texte;
    fil.appendChild(element);
    element.scrollIntoView();
    return element;
  }

  // L'agent veut agir : on affiche deux boutons, et on envoie le choix au serveur.
  function demanderAccord(evenement) {
    const boite = ajouter("bulle accord", "L'agent veut créer une demande d'intervention :\n" + JSON.stringify(evenement.parametres, null, 2) + "\n");
    for (const [libelle, classe, accord] of [["Valider", "oui", true], ["Refuser", "non", false]]) {
      const bouton = document.createElement("button");
      bouton.type = "button"; bouton.textContent = libelle; bouton.className = classe;
      bouton.onclick = () => {
        fetch("/accord", { method: "POST", body: JSON.stringify({ id: evenement.id, accord }) });
        boite.textContent = accord ? "Demande validée." : "Demande refusée.";
      };
      boite.appendChild(bouton);
    }
  }

  function traiter(evenement) {
    if (evenement.type === "outil") ajouter("outil", "outil : " + evenement.nom + " " + JSON.stringify(evenement.parametres));
    if (evenement.type === "accord") demanderAccord(evenement);
    if (evenement.type === "reponse") { sessionId = evenement.sessionId; ajouter("bulle agent", evenement.texte); }
  }

  document.getElementById("formulaire").onsubmit = async (soumission) => {
    soumission.preventDefault();
    const texte = saisie.value.trim();
    if (!texte) return;
    saisie.value = "";
    ajouter("bulle vous", texte);

    // Le serveur renvoie les événements au fil de l'eau, un par ligne.
    const reponse = await fetch("/message", { method: "POST", body: JSON.stringify({ texte, sessionId }) });
    const lecteur = reponse.body.getReader();
    const decodeur = new TextDecoder();
    let tampon = "";
    while (true) {
      const { value, done } = await lecteur.read();
      if (done) break;
      tampon += decodeur.decode(value, { stream: true });
      const lignes = tampon.split("\n");
      tampon = lignes.pop();
      for (const ligne of lignes) if (ligne) traiter(JSON.parse(ligne));
    }
  };
</script>
</body>
</html>
